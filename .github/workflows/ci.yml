name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --lib --bins --examples -- -D warnings
      - name: Production build
        run: cargo build --locked --release --bins
      - name: Linux process and resource qualification
        run: python3 verification/linux.py --binary "$PWD/target/release/apollo-logd" --evidence /tmp/logd-qualification.json
      - name: Qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logd-linux-qualification
          path: /tmp/logd-qualification.json
          if-no-files-found: ignore
